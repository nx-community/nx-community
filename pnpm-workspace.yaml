# Only install packages released at least 7 days ago
minimumReleaseAge: 10080
strictPeerDependencies: true

packages:
  - "apps/*"
  - "packages/*"

peerDependencyRules:
  allowedVersions:
    "typescript": "5.9.2"
minimumReleaseAgeExclude:
  # Renovate security update: @babel/core@7.29.6
  - "@babel/core@7.29.6"

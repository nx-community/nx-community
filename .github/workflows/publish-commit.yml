name: Publish Any Commit

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "!**"
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NX_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      NX_HEAD: ${{ github.event_name == 'pull_request' && 'HEAD' || github.event.after }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Build
        run: pnpm exec nx affected -t=build

      - name: Resolve affected publish paths
        id: publish
        run: |
          AFFECTED=$(pnpm exec nx show projects --affected)
          DIST_PATHS=""

          if echo "$AFFECTED" | grep -qx "plugins-spellcheck"; then
            DIST_PATHS="$DIST_PATHS ./dist/packages/plugins/spellcheck"
          fi
          if echo "$AFFECTED" | grep -qx "nx-graph-to-mermaid"; then
            DIST_PATHS="$DIST_PATHS ./dist/packages/tools/graph-to-mermaid"
          fi

          DIST_PATHS="${DIST_PATHS# }"
          echo "dist_paths=$DIST_PATHS" >> $GITHUB_OUTPUT
          echo "has_affected=$([ -n "$DIST_PATHS" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - if: steps.publish.outputs.has_affected == 'true'
        run: pnpm dlx pkg-pr-new publish ${{ steps.publish.outputs.dist_paths }}

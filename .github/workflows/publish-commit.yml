name: Publish Any Commit

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "!**"
permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile

      - uses: nrwl/nx-set-shas@826660b82addbef3abff5fa871492ebad618c9e1 # v4

      - name: Build
        run: pnpm exec nx affected -t=build

      - name: Resolve affected publish paths
        id: publish
        run: |
          PUBLISHABLE=("plugins-spellcheck" "nx-graph-to-mermaid")
          AFFECTED=$(pnpm exec nx show projects --affected)
          DIST_PATHS=""

          for project in "${PUBLISHABLE[@]}"; do
            if echo "$AFFECTED" | grep -qx "$project"; then
              ROOT=$(pnpm exec nx show project "$project" --json | jq -r '.root')
              DIST_PATHS="$DIST_PATHS ./dist/$ROOT"
            fi
          done

          DIST_PATHS="${DIST_PATHS# }"
          echo "dist_paths=$DIST_PATHS" >> $GITHUB_OUTPUT
          echo "has_affected=$([ -n "$DIST_PATHS" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - if: steps.publish.outputs.has_affected == 'true'
        run: pnpm dlx pkg-pr-new publish ${{ steps.publish.outputs.dist_paths }}
